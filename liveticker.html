<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<style>

html,
body{
    margin:0;
    padding:0;
    background:#0b1220;
}

/* Höhe bewusst größer als der Ticker */
body{
    height:140px;
    overflow:hidden;
}

.top{
    height:54px;
    overflow:hidden;
}

.bottom{
    height:86px;
    background:#0b1220;
}

</style>

</head>

<body>

<div class="top">

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
async>
{
  "symbols": [
    { "proName": "OANDA:EURUSD", "title": "EUR/USD" },
    { "proName": "TVC:DXY", "title": "DXY" },
    { "proName": "OANDA:USDJPY", "title": "USD/JPY" },
    { "proName": "OANDA:XAUUSD", "title": "Gold" },
    { "proName": "BITSTAMP:BTCUSD", "title": "BTC" },
    { "proName": "SP:SPX", "title": "S&P500" }
  ],
  "showSymbolLogo": true,
  "isTransparent": true,
  "displayMode": "adaptive",
  "colorTheme": "dark",
  "locale": "de"
}
</script>

</div>

<div class="bottom"></div>

</body>
</html>
