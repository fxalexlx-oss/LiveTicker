<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
}

.ticker-wrapper {
    width: 100%;
    height: 120px;
    background: #0b1220;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    align-items: center;
}
</style>

</head>

<body>

<div class="ticker-wrapper">

<script
type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
async>
{
  "symbols": [
    {
      "proName": "TVC:DXY",
      "title": "DXY"
    },
    {
      "proName": "OANDA:USDJPY",
      "title": "USD/JPY"
    },
    {
      "proName": "OANDA:XAUUSD",
      "title": "Gold"
    },
    {
      "proName": "BITSTAMP:BTCUSD",
      "title": "BTC"
    },
    {
      "proName": "SP:SPX",
      "title": "S&P500"
    },
    {
      "proName": "OANDA:EURUSD",
      "title": "EUR/USD"
    }
  ],
  "showSymbolLogo": true,
  "isTransparent": true,
  "displayMode": "adaptive",
  "colorTheme": "dark",
  "locale": "de"
}
</script>

</div>

</body>
</html>
