<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #0b1220;
  overflow: hidden;
}
.wrapper {
  width: 100%;
  height: 220px;
  background: #0b1220;
  border-radius: 18px;
  overflow: hidden;
}
</style>
</head>
<body>

<div class="wrapper">
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
async>
{
  "symbols": [
    ["DXY", "TVC:DXY"],
    ["EUR/USD", "OANDA:EURUSD"],
    ["USD/JPY", "OANDA:USDJPY"],
    ["Gold", "OANDA:XAUUSD"],
    ["BTC", "BITSTAMP:BTCUSD"],
    ["S&P500", "SP:SPX"]
  ],
  "chartOnly": false,
  "width": "100%",
  "height": "220",
  "locale": "de",
  "colorTheme": "dark",
  "autosize": false,
  "showVolume": false,
  "showMA": false,
  "hideDateRanges": true,
  "hideMarketStatus": true,
  "hideSymbolLogo": false,
  "scalePosition": "no",
  "scaleMode": "Normal",
  "fontFamily": "Arial",
  "fontSize": "14",
  "noTimeScale": true,
  "valuesTracking": "0",
  "changeMode": "price-and-percent"
}
</script>
</div>

</body>
</html>
