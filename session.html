<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html,body{
margin:0;
padding:0;
background:transparent;
font-family:Inter,Arial;
}

.card{
background:#0b1220;
border-radius:14px;
padding:14px;
color:#e5e7eb;
}

.time{
font-size:22px;
font-weight:700;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
background:#111827;
padding:10px;
margin-top:6px;
border-radius:10px;
}

.active{
color:#00a884;
font-weight:700;
}

.inactive{
color:#6b7280;
}

.countdown{
margin-top:12px;
color:#9ca3af;
font-size:13px;
}

</style>
</head>

<body>

<div class="card">

<div class="time" id="clock"></div>

<div class="row">
<span>Tokyo</span>
<span id="tokyo"></span>
</div>

<div class="row">
<span>London</span>
<span id="london"></span>
</div>

<div class="row">
<span>New York</span>
<span id="ny"></span>
</div>

<div class="countdown" id="countdown"></div>

</div>

<script>

function update(){

const now=new Date();

document.getElementById("clock").innerText=
now.toLocaleTimeString("de-DE");

const h=now.getHours();

setStatus("tokyo",h>=1&&h<9);
setStatus("london",h>=8&&h<17);
setStatus("ny",h>=13&&h<22);

let nextOpen=8;

let diff=(nextOpen-h+24)%24;

document.getElementById("countdown").innerText=
"London Open in "+diff+"h";

}

function setStatus(id,state){

let el=document.getElementById(id);

el.innerText=state?"ACTIVE":"OFF";

el.className=state?"active":"inactive";

}

setInterval(update,1000);

update();

</script>

</body>
</html>
