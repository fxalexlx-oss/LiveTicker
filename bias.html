<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html,body{
margin:0;
padding:0;
background:transparent;
font-family:Inter,Arial;
}

.card{
background:#0b1220;
border-radius:14px;
padding:16px;
color:#e5e7eb;
}

.title{
font-size:13px;
color:#9ca3af;
margin-bottom:8px;
}

.score{
font-size:42px;
font-weight:800;
}

.label{
margin-top:4px;
font-size:14px;
}

.grid{
margin-top:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.box{
background:#111827;
padding:8px;
border-radius:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<div class="title">

</div>

<div class="score">
67
</div>

<div class="label" style="color:#00a884;">

</div>

<div class="grid">

<div class="box">
DXY
<br>
103.8
</div>

<div class="box">
GOLD
<br>
Bearish
</div>

<div class="box">
EURUSD
<br>
Bearish
</div>

<div class="box">
Risk
<br>
Neutral
</div>

</div>

</div>

</body>
</html>
