<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}
.widget {
  background: #0b1220;
  border-radius: 14px;
  overflow: hidden;
}
</style>
</head>
<body>

<div class="widget">
<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js"
async>
{
  "colorTheme": "dark",
  "dateRange": "12M",
  "showChart": true,
  "locale": "de",
  "width": "100%",
  "height": "620",
  "largeChartUrl": "",
  "isTransparent": true,
  "showSymbolLogo": true,
  "tabs": [
    {
      "title": "Forex",
      "symbols": [
        { "s": "OANDA:EURUSD", "d": "EUR/USD" },
        { "s": "OANDA:GBPUSD", "d": "GBP/USD" },
        { "s": "OANDA:USDJPY", "d": "USD/JPY" },
        { "s": "OANDA:USDCHF", "d": "USD/CHF" },
        { "s": "OANDA:AUDUSD", "d": "AUD/USD" },
        { "s": "OANDA:NZDUSD", "d": "NZD/USD" },
        { "s": "OANDA:USDCAD", "d": "USD/CAD" },
        { "s": "OANDA:XAUUSD", "d": "Gold" }
      ]
    },
    {
      "title": "Crypto",
      "symbols": [
        { "s": "BITSTAMP:BTCUSD", "d": "BTC/USD" },
        { "s": "BITSTAMP:ETHUSD", "d": "ETH/USD" },
        { "s": "BINANCE:SOLUSDT", "d": "SOL/USDT" },
        { "s": "BINANCE:XRPUSDT", "d": "XRP/USDT" }
      ]
    }
  ]
}
</script>
</div>

</body>
</html>
