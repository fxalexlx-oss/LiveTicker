<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Watchlist</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #131722;
      overflow: hidden;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100vh;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>

    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js"
      async>
    {
      "width": "100%",
      "height": "100%",
      "symbolsGroups": [
        {
          "name": "FOREX",
          "symbols": [
            { "name": "FX:EURUSD", "displayName": "EURUSD" },
            { "name": "FX:GBPUSD", "displayName": "GBPUSD" },
            { "name": "FX:USDJPY", "displayName": "USDJPY" },
            { "name": "FX:USDCHF", "displayName": "USDCHF" },
            { "name": "FX:AUDUSD", "displayName": "AUDUSD" },
            { "name": "FX:USDCAD", "displayName": "USDCAD" },
            { "name": "FX:NZDUSD", "displayName": "NZDUSD" }
          ]
        },
        {
          "name": "METALS",
          "symbols": [
            { "name": "OANDA:XAUUSD", "displayName": "XAUUSD" }
          ]
        },
        {
          "name": "KRYPTO",
          "symbols": [
            { "name": "BINANCE:BTCUSDT", "displayName": "BTCUSD" }
          ]
        }
      ],
      "showSymbolLogo": true,
      "isTransparent": false,
      "colorTheme": "dark",
      "locale": "de"
    }
    </script>
  </div>
</body>
</html>
